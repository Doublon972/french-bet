<div class="broadcast-card overlay-shine relative overflow-hidden shadow-2xl shadow-amber-500/40 min-w-[460px] text-center backdrop-blur-md bg-gradient-to-b from-amber-950/90 to-slate-950/95 border-2 border-amber-400/60">
  <div class="h-1.5 w-full bg-gradient-to-r from-amber-500 via-yellow-300 to-amber-500"></div>

  <div class="px-9 py-7">
    <div class="overlay-icon-pop text-5xl mb-1 drop-shadow-[0_0_18px_rgba(251,191,36,0.6)]">{{ medal() }}</div>
    <div class="text-amber-300 font-black uppercase tracking-[0.25em] text-xs mb-3">🚩 Groupe sur le podium !</div>
    <div class="text-white font-black text-2xl leading-tight">{{ entry.groupName }}</div>
    <div class="text-amber-300 font-black text-4xl mt-2 drop-shadow-[0_0_18px_rgba(251,191,36,0.5)]">{{ entry.avgElo }} pts</div>
    <div class="inline-flex items-center gap-1.5 mt-4 px-4 py-1 rounded-full bg-yellow-500/15 border border-yellow-400/50 text-yellow-300 font-black text-sm">
      {{ medal() }} #{{ entry.afterRank }} du classement groupes !
    </div>
  </div>
</div>
