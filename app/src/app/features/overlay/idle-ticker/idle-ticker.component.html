@if (hasAnyData()) {
  <div class="broadcast-card overlay-ticker-in overflow-hidden shadow-2xl shadow-black/40 min-w-[340px] backdrop-blur-md bg-gradient-to-b from-slate-900/95 to-slate-950/95 border border-slate-600/50">
    @if (showGroups() && rankedGroups().length > 0) {
      <div class="h-1 w-full bg-gradient-to-r from-amber-500 via-yellow-300 to-amber-500"></div>
      <div class="px-5 py-4">
        <div class="text-amber-300 font-black uppercase tracking-[0.2em] text-[10px] mb-3">🚩 Top Groupes</div>
        <div class="space-y-1.5">
          @for (g of rankedGroups(); track g.id) {
            <div class="flex items-center justify-between text-sm">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-5 text-center font-black text-amber-500/80 text-xs">#{{ g.rank }}</span>
                <span class="font-bold text-white truncate">{{ g.name }}</span>
              </div>
              <span class="font-black text-amber-300 text-xs shrink-0">{{ round(g.avgElo) }}</span>
            </div>
          }
        </div>
      </div>
    } @else {
      <div class="h-1 w-full bg-gradient-to-r from-indigo-500 via-violet-400 to-indigo-500"></div>
      <div class="px-5 py-4">
        <div class="text-indigo-300 font-black uppercase tracking-[0.2em] text-[10px] mb-3">🏆 Top Combattants</div>
        <div class="space-y-1.5">
          @for (p of rankedPlayers(); track p.id) {
            <div class="flex items-center justify-between text-sm">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-5 text-center font-black text-indigo-400/80 text-xs">#{{ p.rank }}</span>
                <span class="font-bold text-white truncate">{{ p.name }}</span>
              </div>
              <span class="font-black text-indigo-300 text-xs shrink-0">{{ round(p.elo) }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
}
